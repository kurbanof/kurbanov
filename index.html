<title>Портфолио Ахмада Курбанова</title>
<meta name="description" content="Ахмад Курбанов: сайты, приложения, игры и обучающие сервисы. Помогаю бизнесу с автоматизацией и оптимизацией процессов.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23FF6B57'/%3E%3Ctext x='16' y='21' font-family='monospace' font-size='14' font-weight='600' text-anchor='middle' fill='%232B120E'%3E%D0%90%D0%9A%3C/text%3E%3C/svg%3E">

<style id="app-css">
:root{
  /* Layout: left-aligned grid, code-style section labels (as on the reference), hero split with a terminal card.
     Light = coral on a pink-white ground. Dark = coral on midnight blue. */
  --bg:#FFF9F7; --surface:#FFFFFF; --surface-2:#FFEFEA; --line:#F2D9D1;
  --fg:#2B1B19; --muted:#6E5A56;
  --accent:#FF6B57; --accent-hover:#FF8070; --on-accent:#2B120E; --accent-ink:#C23B28; --accent-soft:#FFE4DD;
  --term-bg:#2B1B19; --term-fg:#FBEDE9; --term-dim:#C4A9A2; --term-ok:#FF9A88;
  --shadow:0 1px 2px rgba(120,50,35,.06), 0 10px 28px rgba(120,50,35,.08);
  --f-display:'Unbounded','Onest',system-ui,sans-serif;
  --f-body:'Onest',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --f-mono:'JetBrains Mono',ui-monospace,'SF Mono',Menlo,Consolas,monospace;
  --t-xs:.78rem; --t-sm:.9rem; --t-base:1rem; --t-lg:1.15rem;
  --t-h3:1.2rem; --t-h2:clamp(1.55rem,1.1rem + 1.9vw,2.3rem); --t-h1:clamp(2.2rem,1.1rem + 4.8vw,4.1rem);
  --r-card:14px; --r-btn:10px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0D1420; --surface:#141D2C; --surface-2:#1A2538; --line:#26334A;
    --fg:#EDF1F7; --muted:#9BA9BF;
    --accent:#FF7A66; --accent-hover:#FF917F; --on-accent:#1F0C09; --accent-ink:#FF9483; --accent-soft:#3A2329;
    --term-bg:#080D16; --term-fg:#EDF1F7; --term-dim:#8795AB; --term-ok:#FF8B78;
    --shadow:0 1px 2px rgba(0,0,0,.45), 0 10px 28px rgba(0,0,0,.35);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0D1420; --surface:#141D2C; --surface-2:#1A2538; --line:#26334A;
  --fg:#EDF1F7; --muted:#9BA9BF;
  --accent:#FF7A66; --accent-hover:#FF917F; --on-accent:#1F0C09; --accent-ink:#FF9483; --accent-soft:#3A2329;
  --term-bg:#080D16; --term-fg:#EDF1F7; --term-dim:#8795AB; --term-ok:#FF8B78;
  --shadow:0 1px 2px rgba(0,0,0,.45), 0 10px 28px rgba(0,0,0,.35);
  color-scheme:dark;
}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:var(--t-base);line-height:1.6;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
a{color:inherit}
h1,h2,h3,h4,p{margin:0}
h1,h2,h3{text-wrap:balance}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent-ink);outline-offset:3px;border-radius:6px}
.sr{position:absolute;width:1px;height:1px;margin:-1px;padding:0;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}

.wrap{width:100%;max-width:1120px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* header */
.site-header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--bg) 90%,transparent);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.head-row{display:flex;align-items:center;gap:16px;min-height:64px}
.logo{display:flex;align-items:center;gap:10px;text-decoration:none;font-weight:600;white-space:nowrap}
.logo-mark{display:grid;place-items:center;min-width:34px;height:34px;padding:0 6px;border-radius:9px;background:var(--accent);color:var(--on-accent);font-family:var(--f-mono);font-weight:500;font-size:.85rem;letter-spacing:-.02em}
.nav{display:none;position:absolute;left:0;right:0;top:100%;flex-direction:column;gap:2px;background:var(--bg);border-bottom:1px solid var(--line);padding:8px max(16px,env(safe-area-inset-right,0px)) 16px max(16px,env(safe-area-inset-left,0px))}
.nav.open{display:flex}
.nav a{text-decoration:none;color:var(--muted);font-weight:500;padding:10px 4px;border-radius:8px}
.nav a:hover,.nav a[aria-current="page"]{color:var(--fg)}
.nav a[aria-current="page"]{color:var(--accent-ink)}
.head-actions{display:flex;align-items:center;gap:8px;margin-left:auto}
.icon-btn{display:grid;place-items:center;width:40px;height:40px;border-radius:10px;border:1px solid var(--line);background:var(--surface);cursor:pointer}
.icon-btn:hover{border-color:var(--accent)}
.icon-btn svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
@media (min-width:880px){
  .nav{display:flex;position:static;flex-direction:row;gap:6px;border:0;padding:0;background:none;margin-left:24px}
  .nav a{padding:8px 12px}
  .menu-btn{display:none}
}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 20px;border-radius:var(--r-btn);border:1px solid transparent;background:var(--accent);color:var(--on-accent);font-weight:600;font-size:var(--t-base);text-decoration:none;cursor:pointer;transition:background .15s,transform .15s,border-color .15s}
.btn:hover{background:var(--accent-hover)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn-ghost{background:transparent;color:var(--fg);border-color:var(--line)}
.btn-ghost:hover{background:var(--surface);border-color:var(--accent)}
.btn-sm{padding:8px 14px;font-size:var(--t-sm)}

/* section scaffolding */
.section{padding-block:clamp(48px,7vw,88px);scroll-margin-top:calc(64px + env(safe-area-inset-top,0px))}
.code-label{font-family:var(--f-mono);font-size:var(--t-xs);letter-spacing:.06em;text-transform:uppercase;color:var(--accent-ink);margin-bottom:14px}
.h2{font-family:var(--f-display);font-weight:500;font-size:var(--t-h2);line-height:1.2;letter-spacing:-.01em}
.lead{color:var(--muted);font-size:var(--t-lg);max-width:62ch;margin-top:14px}
.sec-head{margin-bottom:clamp(28px,4vw,44px)}

/* hero */
.hero{padding-block:clamp(40px,6vw,80px) clamp(32px,5vw,64px)}
.hero-grid{display:grid;gap:36px;grid-template-columns:minmax(0,1fr);align-items:center}
@media (min-width:900px){.hero-grid{grid-template-columns:minmax(0,1.15fr) minmax(0,.85fr);gap:56px}}
.hero h1{font-family:var(--f-display);font-weight:600;font-size:var(--t-h1);line-height:1.08;letter-spacing:-.02em}
.hero-role{font-size:clamp(1.1rem,1rem + .6vw,1.4rem);font-weight:600;margin-top:20px;max-width:30ch}
.hero-text{color:var(--muted);font-size:var(--t-lg);margin-top:14px;max-width:52ch}
.hero-cta{display:flex;flex-wrap:wrap;gap:12px;margin-top:28px}
.term{background:var(--term-bg);color:var(--term-fg);border-radius:var(--r-card);box-shadow:var(--shadow);overflow:hidden;min-width:0}
.term-bar{display:flex;justify-content:space-between;gap:12px;padding:12px 16px;border-bottom:1px solid color-mix(in srgb,var(--term-dim) 30%,transparent);font-family:var(--f-mono);font-size:var(--t-xs);color:var(--term-dim)}
.term-body{padding:18px 16px 22px;font-family:var(--f-mono);font-size:.86rem;line-height:1.85;overflow-x:auto}
.term-body div{white-space:pre-wrap}
.t-dim{color:var(--term-dim)}
.t-ok{color:var(--term-ok)}
.t-cmd::before{content:"$ ";color:var(--term-ok)}
.cursor{display:inline-block;width:.55em;height:1.05em;background:var(--term-fg);vertical-align:-.18em;animation:blink 1.1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}

/* group tiles */
.tiles{display:grid;gap:16px;grid-template-columns:repeat(3,minmax(0,1fr))}
@media (max-width:900px){.tiles{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:560px){.tiles{grid-template-columns:minmax(0,1fr)}}
.tile{display:flex;flex-direction:column;gap:10px;padding:22px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-card);text-decoration:none;transition:border-color .15s,transform .15s,box-shadow .15s}
.tile:hover{border-color:var(--accent);transform:translateY(-2px);box-shadow:var(--shadow)}
.glyph{align-self:flex-start;font-family:var(--f-mono);font-size:.85rem;font-weight:500;color:var(--accent-ink);background:var(--accent-soft);padding:5px 10px;border-radius:8px}
.tile h3{font-size:var(--t-h3);font-weight:600;line-height:1.25}
.tile p{color:var(--muted);font-size:var(--t-sm)}
.tile .more{margin-top:auto;padding-top:6px;font-size:var(--t-sm);font-weight:600;color:var(--accent-ink)}

/* services */
.svc-grid{display:grid;gap:16px;grid-template-columns:repeat(2,minmax(0,1fr))}
@media (max-width:700px){.svc-grid{grid-template-columns:minmax(0,1fr)}}
.svc{background:var(--surface-2);border-radius:var(--r-card);padding:26px}
.svc .code-label{margin-bottom:10px;color:var(--muted)}
.svc h3{font-size:var(--t-h3);font-weight:600;line-height:1.3}
.svc p{margin-top:10px;color:var(--muted)}

/* about */
.about-grid{display:grid;gap:32px;grid-template-columns:minmax(0,1fr)}
@media (min-width:900px){.about-grid{grid-template-columns:minmax(0,1.1fr) minmax(0,.9fr);gap:56px}}
.about-text .h2{margin-bottom:20px}
.about-text p+p{margin-top:16px}
.about-text p.about-p{color:var(--muted);font-size:var(--t-lg);max-width:60ch}
.feats{display:grid;gap:16px;align-content:start}
.feat{padding:22px;border:1px solid var(--line);border-radius:var(--r-card);background:var(--surface)}
.feat h3{font-size:var(--t-h3);font-weight:600}
.feat p{margin-top:8px;color:var(--muted)}

/* process */
.steps{list-style:none;margin:0;padding:0;display:grid;gap:16px;grid-template-columns:repeat(4,minmax(0,1fr))}
@media (max-width:900px){.steps{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:560px){.steps{grid-template-columns:minmax(0,1fr)}}
.step{padding:22px;border:1px solid var(--line);border-radius:var(--r-card);background:var(--surface)}
.step .num{font-family:var(--f-mono);font-size:var(--t-xs);letter-spacing:.06em;text-transform:uppercase;color:var(--accent-ink)}
.step h3{margin-top:10px;font-size:var(--t-h3);font-weight:600}
.step p{margin-top:8px;color:var(--muted);font-size:var(--t-sm)}

/* contact */
.contact-grid{display:grid;gap:32px;grid-template-columns:minmax(0,1fr);align-items:start}
@media (min-width:900px){.contact-grid{grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:56px}}
.contact-list{display:grid;gap:12px}
.contact{display:flex;flex-wrap:wrap;align-items:center;gap:12px 16px;padding:18px 20px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-card)}
.contact .meta{flex:1 1 180px;min-width:0}
.contact .k{font-family:var(--f-mono);font-size:var(--t-xs);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.contact .v{font-weight:600;font-size:var(--t-lg);overflow-wrap:anywhere;user-select:all}
.contact .acts{display:flex;gap:8px;flex-wrap:wrap}

/* projects page */
.page-head{padding-top:clamp(36px,5vw,64px)}
.page-head h1{font-family:var(--f-display);font-weight:600;font-size:var(--t-h1);line-height:1.1;letter-spacing:-.02em}
.filters{display:flex;flex-wrap:wrap;gap:8px;margin:28px 0 28px}
.chip{display:inline-flex;align-items:center;gap:8px;padding:8px 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-size:var(--t-sm);font-weight:500;transition:border-color .15s,background .15s}
.chip:hover{border-color:var(--accent)}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-weight:600}
.chip .n{font-family:var(--f-mono);font-size:var(--t-xs);opacity:.75}
.proj-grid{display:grid;gap:18px;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));padding-bottom:clamp(48px,7vw,88px)}
.pcard{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-card);overflow:hidden;min-width:0}
.pcard:hover{box-shadow:var(--shadow)}
.cover-wrap{position:relative}
.cover,.cover-img{display:block;width:100%;aspect-ratio:16/10;max-width:100%}
.cover-img{object-fit:cover}
.cover{display:grid;place-items:center;background-color:var(--surface-2);background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);background-size:26px 26px;background-position:-1px -1px}
.cover span{font-family:var(--f-mono);font-size:clamp(1.6rem,1.2rem + 1.6vw,2.4rem);font-weight:500;color:var(--accent-ink);background:var(--surface-2);padding:6px 16px;border-radius:12px}
.badge{position:absolute;top:12px;right:12px;font-family:var(--f-mono);font-size:var(--t-xs);letter-spacing:.04em;text-transform:uppercase;padding:4px 9px;border-radius:7px;background:var(--surface);border:1px dashed var(--accent-ink);color:var(--accent-ink)}
.pbody{display:flex;flex-direction:column;gap:10px;padding:18px 18px 20px;flex:1}
.pmeta{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;font-size:var(--t-xs);font-family:var(--f-mono);letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
.pmeta .dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--accent);margin-right:6px}
.pbody h3{font-size:var(--t-h3);font-weight:600;line-height:1.3}
.pbody p{color:var(--muted);font-size:var(--t-sm)}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:2px}
.tag{font-size:var(--t-xs);padding:3px 9px;border-radius:7px;background:var(--surface-2);color:var(--muted)}
.plinks{margin-top:auto;padding-top:8px;display:flex;gap:8px;flex-wrap:wrap}
.pcard-cta{display:flex;flex-direction:column;justify-content:center;gap:14px;padding:26px;border:1.5px dashed var(--line);border-radius:var(--r-card);min-height:220px}
.pcard-cta h3{font-family:var(--f-display);font-weight:500;font-size:1.2rem;line-height:1.3}
.pcard-cta p{color:var(--muted);font-size:var(--t-sm)}
.pcard-cta .btn{align-self:flex-start}
.empty{grid-column:1 / -1;padding:28px;border:1.5px dashed var(--line);border-radius:var(--r-card);color:var(--muted)}

/* footer */
.site-footer{border-top:1px solid var(--line);padding-block:32px}
.foot-row{display:flex;flex-wrap:wrap;justify-content:space-between;gap:16px 32px;color:var(--muted);font-size:var(--t-sm)}
.foot-links{display:flex;flex-wrap:wrap;gap:6px 20px}
.foot-links a{text-decoration:none}
.foot-links a:hover{color:var(--accent-ink)}
.mono{font-family:var(--f-mono)}

/* ---------- редактор (виден только тем, кто может править страницу) ---------- */
.nav .nav-edit{display:inline-flex;align-items:center;gap:8px;align-self:flex-start;margin-top:8px;padding:9px 16px;border:0;border-radius:999px;background:var(--accent);color:var(--on-accent);font-weight:600;font-size:var(--t-sm);line-height:1.4;cursor:pointer}
.nav .nav-edit:hover{background:var(--accent-hover)}
.nav-edit svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.nav-edit .ed-dot{width:8px;height:8px;border-radius:50%;background:var(--on-accent)}
@media (min-width:880px){.nav .nav-edit{align-self:center;margin:0 0 0 6px}}
.ed{position:fixed;top:0;right:0;bottom:0;z-index:50;width:min(460px,100vw);display:flex;flex-direction:column;background:var(--bg);border-left:1px solid var(--line);box-shadow:var(--shadow);padding-top:env(safe-area-inset-top,0px)}
.ed-head{display:flex;align-items:center;gap:12px;padding:14px max(16px,env(safe-area-inset-right,0px)) 10px 16px}
.ed-head strong{font-family:var(--f-display);font-weight:500;font-size:1rem}
.ed-dirty{margin-left:auto;font-family:var(--f-mono);font-size:var(--t-xs);color:var(--accent-ink)}
.ed-tabs{display:flex;gap:6px;overflow-x:auto;padding:0 max(16px,env(safe-area-inset-right,0px)) 12px 16px;border-bottom:1px solid var(--line);scrollbar-width:thin}
.ed-tab{flex:none;padding:7px 13px;border-radius:999px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-size:var(--t-sm);font-weight:500}
.ed-tab[aria-selected="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-weight:600}
.ed-body{flex:1;min-height:0;overflow:auto;padding:16px max(16px,env(safe-area-inset-right,0px)) 28px 16px;display:grid;gap:24px;align-content:start}
.ed-block{display:grid;gap:12px}
.ed-block h4{font-family:var(--f-mono);font-size:var(--t-xs);letter-spacing:.06em;text-transform:uppercase;color:var(--accent-ink)}
.ed label{display:grid;gap:6px;font-size:var(--t-sm);font-weight:500}
.ed label.ed-check{display:flex;align-items:center;gap:10px}
.ed input[type=checkbox]{width:18px;height:18px;accent-color:var(--accent)}
.ed input[type=text],.ed input[type=password],.ed textarea,.ed select{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--fg);font:inherit;font-size:16px;font-weight:400}
.ed textarea{resize:vertical;line-height:1.5}
.ed small,.ed-hint{color:var(--muted);font-size:var(--t-xs);font-weight:400;line-height:1.5}
.ed-item{border:1px solid var(--line);border-radius:12px;background:var(--surface)}
.ed-item summary{padding:12px 14px;cursor:pointer;font-weight:600;list-style:none;display:flex;align-items:center;gap:10px}
.ed-item summary::-webkit-details-marker{display:none}
.ed-item summary::after{content:"+";margin-left:auto;font-family:var(--f-mono);color:var(--muted)}
.ed-item[open] summary::after{content:"–"}
.ed-item-body{display:grid;gap:14px;padding:0 14px 14px}
.ed-row{display:flex;flex-wrap:wrap;gap:8px}
.ed-lbl{font-size:var(--t-sm);font-weight:500}
.ed-img{display:grid;gap:8px}
.ed-thumb{aspect-ratio:16/10;max-width:240px;display:grid;place-items:center;overflow:hidden;border:1px dashed var(--line);border-radius:10px;color:var(--muted);font-size:var(--t-xs)}
.ed-thumb img{width:100%;height:100%;object-fit:cover}
.filebtn{position:relative}
.filebtn:focus-within{outline:2px solid var(--accent-ink);outline-offset:3px}
.ed-note{padding:14px;border:1px solid var(--accent-ink);border-radius:12px;background:var(--accent-soft);display:grid;gap:10px;font-size:var(--t-sm)}
.ed-foot{border-top:1px solid var(--line);padding:12px max(16px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) 16px;display:grid;gap:10px;background:var(--bg)}
.ed-status{min-height:1.3em;font-size:var(--t-sm);color:var(--muted)}
.ed-status.err{color:var(--accent-ink);font-weight:600}

/* ===================== утилиты ===================== */
const $ = (s, r) => (r || document).querySelector(s);
const $$ = (s, r) => Array.from((r || document).querySelectorAll(s));
const esc = v => String(v == null ? '' : v).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const safeUrl = u => /^https?:\/\//i.test(u || '') ? u : '';
const clone = o => JSON.parse(JSON.stringify(o));
const isObj = v => v && typeof v === 'object' && !Array.isArray(v);
const uid = () => 'g' + Math.random().toString(36).slice(2, 8);
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;

function merge(base, over) {
  if (!isObj(over)) return base;
  for (const k of Object.keys(over)) {
    if (k === '__proto__' || k === 'constructor') continue;
    if (isObj(base[k]) && isObj(over[k])) merge(base[k], over[k]);
    else base[k] = over[k];
  }
  return base;
}

/* ===================== состояние ===================== */
let saved = {};
let state = clone(DEFAULTS);
let SAVED_JSON = JSON.stringify(state);
const previews = {};                       // путь картинки -> data:URL, пока GitHub ещё не выложил файл
const imgSrc = v => previews[v] || v;

const getAt = path => path.split('.').reduce((o, k) => (o == null ? o : o[k]), state);
function setAt(path, v) {
  const ks = path.split('.'), last = ks.pop();
  const o = ks.reduce((a, k) => a[k], state);
  o[last] = v;
}

/* опубликованные данные лежат в site-data.json рядом со страницей */
async function loadPublished() {
  const ctl = new AbortController();
  const timer = setTimeout(() => ctl.abort(), 4000);
  try {
    const r = await fetch('site-data.json', {cache: 'no-cache', signal: ctl.signal});
    if (r.ok) saved = await r.json();
  } catch (err) { /* останется содержимое по умолчанию */ }
  clearTimeout(timer);
  if (!isObj(saved)) saved = {};
  state = merge(clone(DEFAULTS), saved);
  SAVED_JSON = JSON.stringify(state);
}

function termHTML(text) {
  const lines = String(text || '').split('\n');
  return lines.map((ln, i) => {
    const cur = i === lines.length - 1 ? ' <span class="cursor"></span>' : '';
    if (ln.startsWith('$ ')) return `<div class="t-cmd">${esc(ln.slice(2))}${cur}</div>`;
    const t = ln.trimStart();
    if (t.startsWith('✓')) return `<div><span class="t-ok">  ✓</span> ${esc(t.slice(1).trimStart())}${cur}</div>`;
    return `<div class="t-dim">${esc(ln)}${cur}</div>`;
  }).join('');
}

function projectCard(p) {
  const g = state.groups.find(x => x.id === p.group) || state.groups[0] || {short: '', glyph: '{ }'};
  const img = p.image ? `<img class="cover-img" src="${esc(imgSrc(p.image))}" alt="${esc(p.title)}" loading="lazy">`
                      : `<div class="cover" aria-hidden="true"><span>${esc(g.glyph)}</span></div>`;
  const url = safeUrl(p.link);
  const tags = Array.isArray(p.tags) ? p.tags : [];
  return `<article class="pcard">
    <div class="cover-wrap">${img}${p.example ? '<span class="badge">Пример</span>' : ''}</div>
    <div class="pbody">
      <div class="pmeta"><span>${esc(g.short)}</span>${p.status ? `<span><span class="dot"></span>${esc(p.status)}</span>` : ''}</div>
      <h3>${esc(p.title)}</h3>
      <p>${esc(p.desc)}</p>
      ${tags.length ? `<div class="tags">${tags.map(t => `<span class="tag">${esc(t)}</span>`).join('')}</div>` : ''}
      ${url ? `<div class="plinks"><a class="btn btn-sm" href="${esc(url)}" target="_blank" rel="noopener">Открыть проект</a></div>` : ''}
    </div>
  </article>`;
}

function render() {
  $('#app').innerHTML = pageHTML();
  applyRoute();
  paintThemeBtn();
}

function applyRoute() {
  const onProjects = route === 'projects';
  const h = $('#view-home'), pr = $('#view-projects');
  if (!h || !pr) return;
  h.hidden = onProjects;
  pr.hidden = !onProjects;
  $$('.nav a').forEach(a => {
    if (a.dataset.route === 'projects' && onProjects) a.setAttribute('aria-current', 'page');
    else a.removeAttribute('aria-current');
  });
}

function closeMenu() {
  const n = $('#nav'), b = $('#menuBtn');
  if (n) n.classList.remove('open');
  if (b) b.setAttribute('aria-expanded', 'false');
}

function go(token, initial) {
  const t = token || 'home';
  route = t === 'projects' ? 'projects' : 'home';
  applyRoute();
  closeMenu();
  const el = route === 'home' && t !== 'home' ? document.getElementById(t) : null;
  if (el) el.scrollIntoView({behavior: (reduce || initial) ? 'auto' : 'smooth', block: 'start'});
  else window.scrollTo(0, 0);
  if (!initial) { try { history.replaceState(null, '', '#' + t); } catch (err) {} }
}

  if (e.target.closest('.nav-edit')) { closeMenu(); if (toggleEditor) toggleEditor(); return; }

  if (cp) {
    const i = +cp.dataset.copy, c = state.contacts[i], el = $('#cv' + i);
    if (!c) return;
    const done = () => { cp.textContent = 'Скопировано'; setTimeout(() => { cp.textContent = 'Копировать'; }, 1600); };
    const fallback = () => { if (!el) return; const r = document.createRange(); r.selectNodeContents(el); const sel = getSelection(); sel.removeAllRanges(); sel.addRange(r); };
    try { navigator.clipboard.writeText(c.value).then(done).catch(fallback); } catch (err) { fallback(); }
    return;
  }

  const fl = e.target.closest('[data-filter]');
  if (fl) { filter = fl.dataset.filter; render(); return; }

  if (e.target.closest('#themeBtn')) {
    const next = effective() === 'dark' ? 'light' : 'dark';
    document.documentElement.dataset.theme = next;
    try { localStorage.setItem('ak-theme', next); } catch (err) {}
    paintThemeBtn();
    return;
  }

  if (e.target.closest('#menuBtn')) {
    const n = $('#nav'), open = n.classList.toggle('open');
    $('#menuBtn').setAttribute('aria-expanded', String(open));
    return;
  }

  const a = e.target.closest('a[href^="#"]');
  if (!a) return;
  e.preventDefault();
  const tok = a.getAttribute('href').slice(1);
  let changed = false;
  if (a.dataset.group) { filter = a.dataset.group; changed = true; }
  else if (tok === 'projects' && filter !== 'all') { filter = 'all'; changed = true; }
  if (changed) render();
  go(tok);
});

/* ===================== GitHub: вход владельца и сохранение ===================== */
/* Защиту обеспечивает GitHub, а не эта страница: записать файл в репозиторий может только
   владелец ключа доступа. Скрытая кнопка и проверка логина лишь удобство, замка в них нет. */
const ADMIN_LOGIN = 'kurbabof';
const DATA_PATH = 'site-data.json';
const AUTH_KEY = 'ak-gh';
const API = 'https://api.github.com';

let auth = null, fileSha = null, editorReady = false;

const stores = () => {
  const a = [];
  try { a.push(localStorage); } catch (err) {}
  try { a.push(sessionStorage); } catch (err) {}
  return a;
};
const store = {
  get() {
    for (const s of stores()) {
      try { const v = s.getItem(AUTH_KEY); if (v) return JSON.parse(v); } catch (err) {}
    }
    return null;
  },
  set(v, remember) {
    this.clear();
    const s = stores();
    const target = remember ? s[0] : s[s.length - 1];
    try { if (target) target.setItem(AUTH_KEY, JSON.stringify(v)); } catch (err) {}
  },
  clear() { for (const s of stores()) { try { s.removeItem(AUTH_KEY); } catch (err) {} } }
};

const toB64 = text => {
  const bytes = new TextEncoder().encode(text);
  let s = '';
  for (let i = 0; i < bytes.length; i += 0x8000) s += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
  return btoa(s);
};
const fromB64 = b64 => new TextDecoder().decode(Uint8Array.from(atob(String(b64).replace(/\s/g, '')), c => c.charCodeAt(0)));

/* на адресе вида имя.github.io/репозиторий репозиторий определяется сам */
function guessRepo() {
  const m = location.hostname.match(/^([^.]+)\.github\.io$/i);
  if (!m) return '';
  const seg = location.pathname.split('/')[1];
  const repo = seg && !/\.html?$/i.test(seg) ? seg : m[1] + '.github.io';
  return m[1] + '/' + repo;
}

async function gh(a, path, o) {
  o = o || {};
  const headers = Object.assign({'Authorization': 'Bearer ' + a.token, 'Accept': 'application/vnd.github+json'}, o.headers || {});
  if (o.body) headers['Content-Type'] = 'application/json';
  const res = await fetch(API + path, {method: o.method || 'GET', headers, body: o.body ? JSON.stringify(o.body) : undefined});
  if (!res.ok) { const e = new Error('gh_' + res.status); e.status = res.status; throw e; }
  return o.raw ? res.text() : res.json();
}

/* ключ должен принадлежать kurbabof и иметь право записи в этот репозиторий */
async function verifyAuth(token, repo) {
  if (!/^[\w.-]+\/[\w.-]+$/.test(repo)) throw new Error('bad_repo');
  const a = {token, repo};
  const me = await gh(a, '/user');
  if (String(me.login).toLowerCase() !== ADMIN_LOGIN.toLowerCase()) throw new Error('wrong_user');
  const info = await gh(a, '/repos/' + repo);
  if (!info.permissions || !info.permissions.push) throw new Error('no_push');
  a.login = me.login;
  return a;
}

/* свежая версия данных прямо из репозитория, а не из кэша сайта */
async function loadFromRepo(a) {
  const path = '/repos/' + a.repo + '/contents/' + DATA_PATH;
  try {
    const f = await gh(a, path + '?t=' + Date.now());
    let text;
    if (f.encoding === 'base64' && f.content) text = fromB64(f.content);
    else text = await gh(a, path + '?t=' + Date.now(), {raw: true, headers: {'Accept': 'application/vnd.github.raw+json'}});
    return {sha: f.sha, data: JSON.parse(text)};
  } catch (err) {
    if (err.status === 404) return {sha: null, data: {}};
    throw err;
  }
}

function putFile(a, path, b64, sha, message) {
  const body = {message, content: b64};
  if (sha) body.sha = sha;
  return gh(a, '/repos/' + a.repo + '/contents/' + path, {method: 'PUT', body});
}

/* новые картинки уходят отдельными файлами в assets/, затем сохраняется site-data.json */
async function publishAll() {
  for (const p of state.projects) {
    if (typeof p.image === 'string' && p.image.startsWith('data:image/')) {
      const dataUrl = p.image;
      const name = 'assets/p-' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 6) + '.jpg';
      await putFile(auth, name, dataUrl.slice(dataUrl.indexOf(',') + 1), null, 'Добавлена картинка проекта');
      previews[name] = dataUrl;
      p.image = name;
    }
  }
  const text = JSON.stringify(state, null, 2) + '\n';
  const res = await putFile(auth, DATA_PATH, toB64(text), fileSha, 'Обновление сайта через админ-панель');
  fileSha = res.content.sha;
}

async function activate(a) {
  const repoFile = await loadFromRepo(a);
  auth = a;
  fileSha = repoFile.sha;
  saved = isObj(repoFile.data) ? repoFile.data : {};
  state = merge(clone(DEFAULTS), saved);
  SAVED_JSON = JSON.stringify(state);
  if (!editorReady) { editorReady = true; setupEditor(); }
  else render();
}

function authError(err) {
  if (err.message === 'bad_repo') return 'Репозиторий нужно указать так: имя/репозиторий, например kurbabof/kurbabof.github.io.';
  if (err.message === 'wrong_user') return 'Этот ключ выдан другому аккаунту GitHub. Нужен ключ аккаунта ' + ADMIN_LOGIN + '.';
  if (err.message === 'no_push') return 'У ключа нет права записи в этот репозиторий. При создании ключа выберите Contents: Read and write.';
  if (err.status === 401) return 'GitHub не принял ключ. Проверьте, что он скопирован целиком и срок действия не истёк.';
  if (err.status === 404) return 'Репозиторий не найден или ключ к нему не привязан. Проверьте имя и выбранный репозиторий в настройках ключа.';
  if (err.status === 403) return 'GitHub отказал в доступе, возможно из-за большого числа запросов. Подождите минуту и повторите.';
  return 'Нет связи с GitHub. Проверьте интернет и попробуйте ещё раз.';
}

    <label for="loginRepo"><span>Репозиторий сайта</span><input type="text" id="loginRepo" value="${esc(guessRepo() || (ADMIN_LOGIN + '/' + ADMIN_LOGIN + '.github.io'))}" spellcheck="false" autocapitalize="off"></label>
    <label for="loginToken"><span>Ключ доступа GitHub</span><input type="password" id="loginToken" autocomplete="off" spellcheck="false" placeholder="github_pat_…"></label>

    <p class="ed-hint">Где взять ключ: <a href="https://github.com/settings/personal-access-tokens/new" target="_blank" rel="noopener">github.com/settings/personal-access-tokens/new</a>. Выберите Only select repositories и свой репозиторий, затем Repository permissions → Contents → Read and write.</p>
    <div class="ed-status" id="loginStatus" role="status"></div>
    <div class="ed-btns"><button class="btn btn-ghost" type="button" id="loginCancel">Отмена</button><button class="btn" type="submit" id="loginGo">Войти</button></div>
  </form>`;
  document.body.append(ov);

  const form = $('#loginForm', ov), st = $('#loginStatus', ov), goBtn = $('#loginGo', ov);
  const tokenEl = $('#loginToken', ov), repoEl = $('#loginRepo', ov);
  const onKey = e => { if (e.key === 'Escape') closeLogin(); };
  function closeLogin() {
    ov.remove();
    document.removeEventListener('keydown', onKey);
    if (location.hash === '#admin') { try { history.replaceState(null, '', location.pathname + location.search); } catch (err) {} }
  }
  function say(msg, isErr) { st.textContent = msg; st.className = 'ed-status' + (isErr ? ' err' : ''); }

  document.addEventListener('keydown', onKey);
  $('#loginCancel', ov).addEventListener('click', closeLogin);
  ov.addEventListener('mousedown', e => { if (e.target === ov) closeLogin(); });
  form.addEventListener('submit', async e => {
    e.preventDefault();
    const token = tokenEl.value.trim();
    const repo = repoEl.value.trim().replace(/^https?:\/\/github\.com\//i, '').replace(/\/+$/, '');
    if (!token) { say('Вставьте ключ доступа.', true); return; }
    goBtn.disabled = true;
    say('Проверяю ключ…');
    try {
      const a = await verifyAuth(token, repo);
      await activate(a);
      store.set({t: token, r: repo}, $('#loginRemember', ov).checked);
      tokenEl.value = '';
      closeLogin();
      if (openEditor) openEditor();
    } catch (err) {
      say(authError(err), true);
      goBtn.disabled = false;
    }
  });
  tokenEl.focus();
}

    if (btn.dataset.armed) { clearTimeout(+btn.dataset.armed); delete btn.dataset.armed; btn.textContent = btn.dataset.label; return true; }
    btn.dataset.label = btn.textContent;
    btn.textContent = 'Нажмите ещё раз';
    btn.dataset.armed = String(setTimeout(() => { btn.textContent = btn.dataset.label; delete btn.dataset.armed; }, 3000));
    return false;
  }

  function blockHTML(b) {
    if (b.t === 'fields') {
      const obj = getAt(b.path) || {};
      return `<section class="ed-block">${b.title ? `<h4>${esc(b.title)}</h4>` : ''}${b.hint ? `<p class="ed-hint">${esc(b.hint)}</p>` : ''}${b.fields.map(f => fieldHTML(b.path + '.' + f.k, f, obj[f.k])).join('')}</section>`;
    }
    if (b.t === 'action') {
      return `<section class="ed-block"><button class="btn btn-ghost" type="button" data-act="${b.act}">${esc(b.label)}</button>${b.hint ? `<p class="ed-hint">${esc(b.hint)}</p>` : ''}</section>`;
    }
    const arr = getAt(b.path) || [];
    const items = arr.map((it, i) => {
      const key = b.path + '.' + i;
      const title = it[b.item] || 'Без названия';
      return `<details class="ed-item" data-key="${esc(key)}"${ui.open.has(key) ? ' open' : ''}>
        <summary><span class="st">${esc(title)}</span></summary>
        <div class="ed-item-body">${b.fields.map(f => fieldHTML(key + '.' + f.k, f, it[f.k])).join('')}
          <div class="ed-row">
            <button class="btn btn-sm btn-ghost" type="button" data-act="up" data-path="${b.path}" data-i="${i}"${i === 0 ? ' disabled' : ''}>Выше</button>
            <button class="btn btn-sm btn-ghost" type="button" data-act="down" data-path="${b.path}" data-i="${i}"${i === arr.length - 1 ? ' disabled' : ''}>Ниже</button>
            <button class="btn btn-sm btn-ghost" type="button" data-act="del" data-path="${b.path}" data-i="${i}">Удалить</button>
          </div></div></details>`;
    }).join('');
    return `<section class="ed-block"><h4>${esc(b.title)}</h4>${items}<button class="btn btn-ghost" type="button" data-act="add" data-path="${b.path}">${esc(b.addLabel || 'Добавить')}</button></section>`;
  }

  function draftDiffers() {
    const d = ss.get(DRAFT_KEY);
    if (!d) return false;
    try { return JSON.stringify(merge(clone(DEFAULTS), JSON.parse(d))) !== JSON.stringify(state); } catch (err) { return false; }
  }

  function renderTabs() {
    tabsEl.innerHTML = TABS.map(t => `<button class="ed-tab" type="button" role="tab" data-tab="${t.id}" aria-selected="${t.id === ui.tab}">${esc(t.title)}</button>`).join('');
  }
  function renderBody(keepScroll) {
    const top = body.scrollTop;
    const tab = TABS.find(t => t.id === ui.tab) || TABS[0];
    const banner = ui.banner ? `<div class="ed-note"><span>Найден несохранённый черновик прошлой правки. Восстановить его?</span>
      <div class="ed-row"><button class="btn btn-sm" type="button" data-act="draft-restore">Восстановить</button><button class="btn btn-sm btn-ghost" type="button" data-act="draft-drop">Удалить черновик</button></div></div>` : '';
    body.innerHTML = banner + tab.blocks.map(blockHTML).join('');
    body.scrollTop = keepScroll ? top : 0;
  }
  function setTab(id) {
    ui.tab = id;
    renderTabs();
    renderBody(false);
    const tab = TABS.find(t => t.id === id);
    if (tab && tab.go) go(tab.go);
  }

  function refreshDirty() {
    dirty = JSON.stringify(state) !== SAVED_JSON;
    $('#edDirty', panel).hidden = !dirty;
    editDirty = dirty;
    const dot = $('.nav-edit .ed-dot');
    if (dot) dot.hidden = !dirty;
    saveBtn.disabled = !dirty || saving || locked;
  }
  function touch() {
    $('#edDirty', panel).hidden = false;
    saveBtn.disabled = locked;
    editDirty = true;
    const dot = $('.nav-edit .ed-dot');
    if (dot) dot.hidden = false;
    clearTimeout(renderTimer);
    renderTimer = setTimeout(() => { render(); refreshDirty(); }, 220);
    clearTimeout(draftTimer);
    draftTimer = setTimeout(() => { if (dirty) ss.set(DRAFT_KEY, JSON.stringify(state)); }, 800);
  }

  function dropOpen(path) { Array.from(ui.open).forEach(k => { if (k.startsWith(path + '.')) ui.open.delete(k); }); }
  function listAct(act, path, i) {
    const b = LISTS[path], arr = getAt(path);
    if (!b || !arr) return;
    if (act === 'add') { arr.push(b.make()); dropOpen(path); ui.open.add(path + '.' + (arr.length - 1)); }
    else if (act === 'up' && i > 0) { [arr[i - 1], arr[i]] = [arr[i], arr[i - 1]]; dropOpen(path); ui.open.add(path + '.' + (i - 1)); }
    else if (act === 'down' && i < arr.length - 1) { [arr[i + 1], arr[i]] = [arr[i], arr[i + 1]]; dropOpen(path); ui.open.add(path + '.' + (i + 1)); }
    else if (act === 'del') {
      const msg = b.guard ? b.guard(i) : '';
      if (msg) { setStatus(msg, true); return; }
      arr.splice(i, 1); dropOpen(path);
    } else return;
    setStatus('');
    renderBody(true);
    touch();
  }

  function fileToDataUrl(file, maxW, q) {
    return new Promise((resolve, reject) => {
      const url = URL.createObjectURL(file), im = new Image();
      im.onload = () => {
        const sc = Math.min(1, maxW / im.naturalWidth), w = Math.max(1, Math.round(im.naturalWidth * sc)), h = Math.max(1, Math.round(im.naturalHeight * sc));
        const c = document.createElement('canvas'); c.width = w; c.height = h;
        const x = c.getContext('2d'); x.fillStyle = '#fff'; x.fillRect(0, 0, w, h); x.drawImage(im, 0, 0, w, h);
        URL.revokeObjectURL(url);
        resolve(c.toDataURL('image/jpeg', q));
      };
      im.onerror = () => { URL.revokeObjectURL(url); reject(new Error('bad_image')); };
      im.src = url;
    });
  }

  /* ---- события панели ---- */
  function readField(el) {
    const kind = el.dataset.kind;
    if (kind === 'check') return el.checked;
    if (kind === 'tags') return el.value.split(',').map(s => s.trim()).filter(Boolean);
    return el.value;
  }
  function onFieldEvent(e) {
    const el = e.target.closest('[data-path][data-kind]');
    if (!el || !body.contains(el)) return;
    const kind = el.dataset.kind;
    if ((kind === 'check' || kind === 'select') && e.type === 'input') return;
    if (e.type === 'change' && kind !== 'check' && kind !== 'select') return;
    setAt(el.dataset.path, readField(el));
    if (el.dataset.title) {
      const st = el.closest('details') && el.closest('details').querySelector('.st');
      if (st) st.textContent = el.value || 'Без названия';
    }
    touch();
  }
  body.addEventListener('input', onFieldEvent);
  body.addEventListener('change', async e => {
    const fi = e.target.closest('input[type=file][data-img]');
    if (fi) {
      const file = fi.files && fi.files[0];
      if (!file) return;
      setStatus('Обрабатываю картинку…');
      try {
        const url = await fileToDataUrl(file, 1100, 0.82);
        setAt(fi.dataset.img, url);
        const th = fi.closest('.ed-img').querySelector('.ed-thumb');
        th.innerHTML = '';
        const im = document.createElement('img'); im.src = url; im.alt = ''; th.append(im);
        setStatus('');
        touch();
      } catch (err) { setStatus('Не удалось прочитать картинку. Попробуйте другой файл.', true); }
      fi.value = '';
      return;
    }
    onFieldEvent(e);
  });
  body.addEventListener('toggle', e => {
    const d = e.target;
    if (d && d.matches && d.matches('details[data-key]')) { if (d.open) ui.open.add(d.dataset.key); else ui.open.delete(d.dataset.key); }
  }, true);
  body.addEventListener('click', e => {
    const b = e.target.closest('[data-act]');
    if (!b) return;
    const act = b.dataset.act, path = b.dataset.path, i = +b.dataset.i;
    if (act === 'add' || act === 'up' || act === 'down') return listAct(act, path, i);
    if (act === 'del') { if (!armed(b)) return; return listAct('del', path, i); }
    if (act === 'img-clear') {
      setAt(path, '');
      const th = b.closest('.ed-img').querySelector('.ed-thumb');
      th.innerHTML = '<span>нет картинки</span>';
      touch();
      return;
    }
    if (act === 'clean-examples') {
      if (!armed(b)) return;
      const before = state.projects.length;
      state.projects = state.projects.filter(p => !p.example);
      setStatus(before === state.projects.length ? 'Примеров не найдено.' : 'Примеры удалены. Не забудьте сохранить.');
      touch();
      return;
    }
    if (act === 'draft-restore') {
      try { state = merge(clone(DEFAULTS), JSON.parse(ss.get(DRAFT_KEY))); } catch (err) {}
      ui.banner = false; renderBody(false); render(); refreshDirty(); setStatus('Черновик восстановлен.');
      return;
    }
    if (act === 'draft-drop') { ss.del(DRAFT_KEY); ui.banner = false; renderBody(true); return; }
  });
  tabsEl.addEventListener('click', e => { const t = e.target.closest('[data-tab]'); if (t) setTab(t.dataset.tab); });

  resetBtn.addEventListener('click', () => {
    if (dirty && !armed(resetBtn)) return;
    state = merge(clone(DEFAULTS), saved);
    ss.del(DRAFT_KEY);
    render(); renderBody(true); refreshDirty(); setStatus('Правки отменены.');
  });

  function openPanel() {
    ui.banner = draftDiffers();
    renderTabs(); renderBody(false);
    panel.hidden = false;
    document.body.classList.add('editing');
    refreshDirty();
    $('#edClose', panel).focus();
  }
  function closePanel() {
    panel.hidden = true;
    document.body.classList.remove('editing');
    const nb = $('.nav-edit');
    if (nb) nb.focus();
  }
  toggleEditor = () => { if (panel.hidden) openPanel(); else closePanel(); };
  openEditor = () => { if (panel.hidden) openPanel(); };
  editEnabled = true;
  render();
  $('#edClose', panel).addEventListener('click', closePanel);
  document.addEventListener('keydown', e => { if (e.key === 'Escape' && !panel.hidden) closePanel(); });

  /* ---- вход и сохранение: запись файлов в репозиторий GitHub ---- */
  $('#edWho', panel).textContent = 'Вы вошли как ' + auth.login + ' · ' + auth.repo;
  $('#edLogout', panel).addEventListener('click', e => {
    const b = e.currentTarget;
    if (dirty && !armed(b)) { setStatus('Есть несохранённые правки. Нажмите «Выйти» ещё раз, чтобы выйти без сохранения.', true); return; }
    store.clear();
    ss.del(DRAFT_KEY);
    location.replace(location.pathname + location.search);
  });

  function saveError(err) {
    if (err.status === 401) return 'GitHub больше не принимает ключ, возможно истёк срок действия. Выйдите и войдите с новым ключом.';
    if (err.status === 403 || err.status === 404) return 'У ключа нет права записи в репозиторий. Проверьте, что в ключе выбрано Contents: Read and write.';
    if (err.status === 409 || err.status === 422) return 'Файл на GitHub изменился в другом месте. Обновите страницу, чтобы загрузить свежую версию. Ваши правки сохранены в черновике.';
    return 'Не удалось сохранить: нет связи с GitHub. Попробуйте ещё раз.';
  }

  saveBtn.addEventListener('click', async () => {
    if (saving) return;
    clearTimeout(renderTimer);
    saving = true; saveBtn.disabled = true; body.inert = true;
    setStatus('Сохраняю…');
    ss.set(DRAFT_KEY, JSON.stringify(state));
    try {
      await publishAll();
      saved = clone(state);
      SAVED_JSON = JSON.stringify(state);
      ss.del(DRAFT_KEY);
      render();
      renderBody(true);
      setStatus('Сохранено в GitHub. Посетители увидят изменения через 1–2 минуты.');
    } catch (err) {
      setStatus(saveError(err), true);
    }
    saving = false; body.inert = false;
    refreshDirty();
  });
}

/* ===================== старт ===================== */
const known = ['home', 'projects', 'project-groups', 'services', 'about', 'process', 'contact'];

/* если на этом устройстве уже есть ключ, кнопка «Редактировать» появится после проверки */
async function initAdmin() {
  const s = store.get();
  if (s && s.t && s.r) {
    try { await activate(await verifyAuth(s.t, s.r)); }
    catch (err) { if (err.status === 401 || err.message === 'wrong_user' || err.message === 'no_push') store.clear(); }
  }
  if (location.hash === '#admin') openAdminEntry();
}

(async function start() {
  await loadPublished();
  render();
  const tok = location.hash.slice(1);
  go(known.includes(tok) ? tok : 'home', true);
  initAdmin();
})();
</script>
